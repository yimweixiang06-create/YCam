name: YCam iPhone16Pro 50M five-minute color checks

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/calibrate-photos-5min.yml"
      - "tools/ycam_50m_photo_proxy.py"
      - "calibration/iphone16pro_50m_sufficient_stats.json"
      - "calibration/iphone16pro_recovered_113_photo_samples.b85"
      - "tools/ycam_each_image_10m.py"

concurrency:
  group: ycam-iphone16pro-50m-five-minute
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  iPhone16Pro-color-proxy:
    name: Compare 50M candidate color parameters using user's own iPhone16Pro chart
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout current camera source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up numerical runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check --quiet numpy

      - name: Compute actual candidate count on user's chart-derived statistics
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python tools/ycam_50m_photo_proxy.py --target 50000000 --seconds 155

      - name: Verify 10 million fast color-proxy candidates for each recovered source image in this batch
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: python tools/ycam_each_image_10m.py --images-per-run 10 --seconds 120

      - name: Upload auditable real-count surrogate color check report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ycam-iphone16pro-50m
          path: reports/iphone16pro_50m/
          if-no-files-found: warn
          retention-days: 3

      - name: Disable repeated checking when cutoff November 18 at 15:00 MYT arrives
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 - <<'PY'
          from datetime import datetime, timezone
          raise SystemExit(0 if datetime.now(timezone.utc) >= datetime(2026,11,18,7,0,tzinfo=timezone.utc) else 1)
          PY
          then
            echo "Deadline reached. Disabling the five-minute workflow."
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/calibrate-photos-5min.yml/disable" || echo "::warning::Could not auto-disable; the Python cutoff prevents additional computations."
          fi

# The old workflow that fetched Wikimedia Commons photos has been replaced.
# Only derived RGB sample statistics from user's iPhone16Pro photos/screenshots are used.
# 50 million means first-order quadratic candidate SCORES, not actual Apple
# camera photo renders. This workflow never edits Styles.swift or publishes IPA.

# Per-image 10M test: 10 unique photos per five-minute run, rotating through
# 113 distinct recovered files. Checks are not full renders and do not change filters.
