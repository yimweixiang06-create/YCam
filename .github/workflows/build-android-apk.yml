name: Build YCam Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - "*.swift"
      - "Info.plist"
      - "YCam.xcodeproj/**"
      - ".github/workflows/build-unsigned-ipa.yml"
      - ".github/workflows/build-android-apk.yml"

concurrency:
  group: ycam-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Android compile, tests and APK package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Lint, unit tests and debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: APK integrity and package metadata
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "com.ycam.camera.android"
          sha256sum "$APK" | tee android-apk.sha256

      - name: Upload installable Android debug APK for QA
        uses: actions/upload-artifact@v4
        with:
          name: YCam-Android-debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-apk.sha256
          retention-days: 14
          if-no-files-found: error

  emulator-smoke:
    name: Android emulator install and launch
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download same build's APK
        uses: actions/download-artifact@v4
        with:
          name: YCam-Android-debug-APK
          path: android-tested-apk

      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android API 30 real install/launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -e
            adb install android-tested-apk/app-debug.apk
            adb shell pm grant com.ycam.camera.android android.permission.CAMERA
            adb shell pm grant com.ycam.camera.android android.permission.RECORD_AUDIO
            adb shell am start -W -n com.ycam.camera.android/.MainActivity
            sleep 8
            adb shell pidof com.ycam.camera.android
            echo "PASS: Android APK installed and MainActivity survived launch"
